services:
  - type: web
    name: campus-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @shms/shared run build && pnpm --filter @shms/api run build
    startCommand: pnpm --filter @shms/api run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: campus-admin-web
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @shms/shared run build && pnpm --filter @shms/admin-web run build
    startCommand: pnpm --filter @shms/admin-web run start:render
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_ORIGIN
        fromService:
          name: campus-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
