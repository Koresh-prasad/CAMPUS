<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="192" height="192" rx="40" fill="url(#grad1)"/>
  
  <!-- Campus Building / Door Icon with Shield -->
  <g transform="translate(36, 36)" filter="url(#shadow)">
    <!-- Roof / Crest -->
    <path d="M60 10 L10 45 L110 45 Z" fill="#FFFFFF"/>
    <!-- Pillars -->
    <rect x="22" y="52" width="12" height="48" rx="3" fill="#DBEAFE"/>
    <rect x="54" y="52" width="12" height="48" rx="3" fill="#DBEAFE"/>
    <rect x="86" y="52" width="12" height="48" rx="3" fill="#DBEAFE"/>
    <!-- Base -->
    <rect x="10" y="102" width="100" height="10" rx="3" fill="#FFFFFF"/>
    <!-- Security QR Badge inside -->
    <circle cx="60" cy="74" r="16" fill="#F59E0B"/>
    <path d="M55 74 L58 77 L66 69" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
